<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
        }
        #result {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Palindrome Checker</h2>
    <input type="text" id="textInput" placeholder="Enter a word or phrase">
    <button onclick="checkPalindrome()">Check</button>
    <p id="result"></p>

    <script>
        function checkPalindrome() {
            let input = document.getElementById("textInput").value;
            
            // Remove non-alphanumeric characters and convert to lowercase
            let cleaned = input.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            
            // Reverse the cleaned string
            let reversed = cleaned.split("").reverse().join("");
            
            // Compare original and reversed
            if (cleaned === reversed) {
                document.getElementById("result").innerHTML = "✅ It's a Palindrome!";
            } else {
                document.getElementById("result").innerHTML = "❌ Not a Palindrome!";
            }
        }
    </script>

</body>
</html>
